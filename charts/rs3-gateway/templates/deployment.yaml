{{- include "rs3-gateway.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rs3-gateway.fullname" . }}
  labels:
    {{- include "rs3-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy.type | quote }}
  selector:
    matchLabels:
      {{- include "rs3-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rs3-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      # Only Lease-backed deployments need ambient Kubernetes API credentials.
      automountServiceAccountToken: {{ eq .Values.anchor.mode "kubernetes-lease" }}
      enableServiceLinks: false
      {{- if eq .Values.anchor.mode "kubernetes-lease" }}
      serviceAccountName: {{ include "rs3-gateway.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.bootstrap.enabled }}
      initContainers:
        - name: wait-for-init
          image: {{ include "rs3-gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - wait-for-init
            - --journal-file
            - /etc/rs3/bootstrap/state
            - --timeout-seconds
            - {{ .Values.bootstrap.timeoutSeconds | quote }}
          env:
            {{- include "rs3-gateway.environment" (dict "root" . "bootstrap" false) | nindent 12 }}
          volumeMounts:
            - name: bootstrap-journal
              mountPath: /etc/rs3/bootstrap
              readOnly: true
            - name: provider-conformance
              mountPath: /etc/rs3/provider-conformance
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "rs3-gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - serve
            {{- if .Values.recovery.point }}
            - --recovery-point
            - {{ .Values.recovery.point | quote }}
            {{- end }}
          ports:
            - name: s3
              containerPort: {{ .Values.service.port }}
            {{- if .Values.admin.enabled }}
            - name: admin
              containerPort: {{ .Values.admin.port }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            {{- include "rs3-gateway.environment" (dict "root" . "bootstrap" false) | nindent 12 }}
          {{- if .Values.admin.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - name: repository-data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.providerConformance.existingConfigMap .Values.bootstrap.enabled .Values.bootstrap.existingJournalSecret }}
            - name: provider-conformance
              mountPath: /etc/rs3/provider-conformance
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: repository-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "rs3-gateway.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if or .Values.providerConformance.existingConfigMap .Values.bootstrap.enabled .Values.bootstrap.existingJournalSecret }}
        - name: provider-conformance
          {{- if .Values.providerConformance.existingConfigMap }}
          configMap:
            name: {{ .Values.providerConformance.existingConfigMap | quote }}
            items:
              - key: {{ .Values.providerConformance.reportKey | quote }}
                path: report.json
          {{- else }}
          secret:
            secretName: {{ include "rs3-gateway.bootstrapJournalName" . | quote }}
            optional: true
            items:
              - key: provider-conformance.json
                path: report.json
          {{- end }}
        {{- end }}
        {{- if .Values.bootstrap.enabled }}
        - name: bootstrap-journal
          secret:
            secretName: {{ include "rs3-gateway.bootstrapJournalName" . | quote }}
            optional: true
            items:
              - key: state
                path: state
        {{- end }}
