# Run one read-write gateway pod per repository. Scale-out restore readers
# should use restore-readonly mode with separate coordination.
replicaCount: 1

# Gateway container image. Override repository/tag for published images or
# integration-test images built by xtask.
image:
  repository: rs3-server
  tag: ci
  # Production requires an immutable sha256 digest. When set, digest wins over
  # tag while tag remains useful for local integration images.
  digest: ""
  pullPolicy: IfNotPresent

# Cluster-internal S3-compatible listener.
service:
  type: ClusterIP
  port: 9080

# Gateway admin listener used for health probes and path-redacted operator
# facts. Token material must come from an existing Secret or explicit fixture
# values, never from chart defaults.
admin:
  enabled: true
  # production also requires an immutable image, HTTPS backend, external Secret
  # references, readiness, and fenced Lease coordination for read-write mode.
  # local is an explicit development escape hatch and must not be exposed.
  profile: production
  port: 9081
  createToken: false
  existingTokenSecret: ""
  bearerToken: ""
  # Optional admin mutation bearer token. State-changing POST maintenance
  # endpoints (dry-run, apply, cancel, pause, resume) stay disabled unless this
  # token is present; without it the admin listener serves read-only GETs only.
  # The server requires it to differ from the read bearer token and to be at
  # least 16 bytes. When createToken=true the chart stores this value in the
  # admin Secret under the mutation-bearer-token key. In production (external
  # Secret references), leave this empty and add a mutation-bearer-token key to
  # admin.existingTokenSecret instead; the deployment reads that key optionally.
  mutationBearerToken: ""

# In-process maintenance supervisor. Unset values fall back to the gateway's
# built-in defaults (shown in parentheses); only explicitly set values render as
# environment variables so the server stays the single source of truth for
# defaults. restore-readonly gateways force maintenance off and reject
# RS3_MAINTENANCE_MODE, so maintenance.mode must stay unset in that mode.
maintenance:
  # auto renews retention and reclaims orphans automatically; manual expects an
  # external process to drive full maintenance; off disables the supervisor.
  # (default auto). Leave empty for gateway.mode=restore-readonly.
  mode: ""
  # Lead time before a retention deadline at which renewal is scheduled, in
  # seconds. (default 604800, i.e. 7 days)
  renewalHorizonSeconds: null
  # Orphan reclamation pressure thresholds. (defaults: 1073741824 bytes = 1 GiB;
  # 512 objects; 172800 seconds = 2 days max age)
  orphanPressureBytes: null
  orphanPressureCount: null
  orphanPressureMaxAgeSeconds: null
  # Upper bound between automatic full-maintenance runs, in seconds.
  # (default 604800, i.e. 7 days)
  maxIntervalSeconds: null
  # Minimum cooldown between full-maintenance runs, in seconds. Must be less than
  # or equal to maxIntervalSeconds. (default 3600, i.e. 1 hour)
  minCooldownSeconds: null
  # Optional pacing delay between backend maintenance operations, in
  # milliseconds. Opt-in with no built-in default; leave unset to run unthrottled.
  pacingDelayMs: null
  # Inventory scan caps that bound a single maintenance pass.
  # (defaults: 4096 pages; 2000000 items)
  maxInventoryPages: null
  maxInventoryItems: null

# Persisted output from `rs3 check-v2-provider --format json`. Retained
# automatic maintenance fails closed without current evidence for the selected
# provider profile. Store the path-redacted JSON report in a ConfigMap created
# outside this chart so qualification remains an explicit release operation.
providerConformance:
  existingConfigMap: ""
  reportKey: report.json
  maxAgeSeconds: 604800
  # Lowercase SHA-256 fingerprint of the exact IAM/service-account principal
  # whose governance-bypass permissions were reviewed. Required for governance
  # retention and bound into the evidence target fingerprint.
  principalFingerprint: ""

# Optional Prometheus metrics listener. Enable ServiceMonitor only in clusters
# with the Prometheus Operator CRDs installed.
metrics:
  enabled: false
  port: 9082
  serviceMonitor:
    enabled: false

# Optional Prometheus alerting rules over maintenance health metrics. Rendered
# only when metrics.enabled=true (the metrics API is available) and
# alerts.enabled=true, mirroring how the ServiceMonitor is guarded. Requires the
# Prometheus Operator PrometheusRule CRD. Rules stay path-private: they carry
# only metric names, numeric thresholds, and severity labels.
alerts:
  enabled: false
  # Extra labels merged onto the PrometheusRule metadata (for example a
  # Prometheus rule-routing label). Keep these free of paths and object keys.
  labels: {}

# Optional baseline NetworkPolicy. Empty selectors render deny-all rules in the
# local profile and fail validation when the production profile enables the
# policy. Configure narrow peers for S3 clients, metrics scrapers, the backend,
# cluster DNS, and the kube-apiserver, or replace this with provider-specific
# policy.
networkPolicy:
  enabled: false
  ingress:
    namespaceSelector: {}
    podSelector: {}
    metrics:
      namespaceSelector: {}
      podSelector: {}
  egress:
    backend:
      to: []
      ports:
        - protocol: TCP
          port: 443
    kubeApi:
      to: []
      ports:
        - protocol: TCP
          port: 443
    # DNS peers are cluster-specific. Select only the cluster DNS pods or their
    # documented service IP; the template fixes the allowed ports to UDP/TCP 53.
    dns:
      to: []

# read-write accepts repository mutations; restore-readonly rejects them.
# writerGuard=required enforces Kubernetes Lease coordination for read-write.
gateway:
  mode: read-write
  writerGuard: required

# Resource and request-admission limits. Increase multipart part size only after
# checking backend compatibility and memory budgets.
hardening:
  maxPutObjectBytes: 5368709120
  backendMultipartPartBytes: 16777216
  maxInFlightUploadBodyBytes: 536870912
  requestRateLimitPerSecond: 1024

# Public S3 bucket name presented to backup clients. This is not the backend
# object-store bucket.
publicBucket: client-bucket

# Backend object store. file:// is for local/dev PVC-backed smoke tests; use an
# S3-compatible endpoint for production-like deployments.
backend:
  endpoint: file:///data
  bucket: backend
  prefix: repository
  region: us-east-1

# Credentials for the backend object store. Prefer existingSecret in production.
backendCredentials:
  create: false
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

# Static S3 credentials accepted from backup clients. Prefer existingSecret in
# production and rotate credentials outside Helm history when possible.
credentials:
  create: false
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

# Commit batching trades write latency for fewer repository commits.
commit:
  maxBatchItems: 8
  maxBatchDelayMs: 5
  maxPendingItems: 8

# Repository identity settings. allowInit should only be true for a new, empty
# repository prefix under operator control.
repository:
  id: rs3-repository
  allowInit: false
  # Leave unset to use adaptive per-object segment sizing. Set a positive value
  # only for fixed-size compatibility or performance sweeps.
  payloadSegmentSizeBytes: null
  retention:
    mode: ""
    days: 0

# Repository key material and encrypted keyring envelope settings. Production
# requires existingSecret so secret bytes do not enter Helm release history.
repositoryKeys:
  create: false
  existingSecret: ""
  saltHex: ""
  envelopeObjectId: ""
  wrappingKeyId: wrap-v1
  wrappingKeyHex: ""

# Offline disaster-recovery verification key. This is public key material and
# may be stored in Helm values; keep the corresponding signing key offline.
recovery:
  publicKey: ""

# Rollback anchor coordination. Kubernetes Lease anchoring is the production
# preview default; memory anchors are local-development only.
anchor:
  mode: kubernetes-lease
  allowMemory: false
  namespace: ""
  name: v2-anchor
  fieldManager: rs3-server

# plain logs are human-readable; json logs are structured for collectors.
logging:
  format: plain
  rustLog: info

# Enable only for file:// backend smoke tests or other explicitly local storage.
persistence:
  enabled: false
  mountPath: /data
  storageClassName: ""
  size: 1Gi

# Default restricted pod security context for the gateway container.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# Default restricted container security context. `/tmp` is mounted as an
# emptyDir because the root filesystem is read-only.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Service account used by the gateway pod and Lease RBAC.
serviceAccount:
  create: true
  name: ""

# Lease RBAC. Set existing=true only when equivalent permissions are managed
# outside this chart.
rbac:
  create: true
  existing: false

# Kubernetes resource requests and limits. The memory limit leaves headroom
# above the measured roughly 790 MiB RSS in tests/PERFORMANCE_BASELINE.md; keep
# CPU as a request, not a limit, so crypto and compression can burst.
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1536Mi

# Recreate avoids two read-write gateway pods briefly racing on the same anchor.
updateStrategy:
  type: Recreate
