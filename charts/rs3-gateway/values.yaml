replicaCount: 1

image:
  repository: rs3-server
  tag: ci
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9080

publicBucket: client-bucket

backend:
  endpoint: file:///data
  bucket: backend
  prefix: repository
  region: us-east-1

backendCredentials:
  create: false
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

credentials:
  create: false
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

commit:
  maxBatchItems: 8
  maxBatchDelayMs: 5

repository:
  payloadSegmentSizeBytes: 512

repositoryKeys:
  create: false
  existingSecret: ""
  masterKeyHex: ""

anchor:
  mode: memory
  namespace: ""
  name: checkpoint
  fieldManager: rs3-server

logging:
  format: plain
  rustLog: info

persistence:
  enabled: false
  mountPath: /data
  storageClassName: ""
  size: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

resources: {}
