# Run one read-write gateway pod per repository. Scale-out restore readers
# should use restore-readonly mode with separate coordination.
replicaCount: 1

# Gateway container image. Override repository/tag for published images or
# integration-test images built by xtask.
image:
  repository: rs3-server
  tag: ci
  # Production requires an immutable sha256 digest. When set, digest wins over
  # tag while tag remains useful for local integration images.
  digest: ""
  pullPolicy: IfNotPresent

# Cluster-internal S3-compatible listener.
service:
  type: ClusterIP
  port: 9080

# Gateway admin listener used for health probes and path-redacted operator
# facts. Token material must come from an existing Secret or explicit fixture
# values, never from chart defaults.
admin:
  enabled: true
  # production also requires an immutable image, HTTPS backend, external Secret
  # references, readiness, and fenced Lease coordination for read-write mode.
  # local is an explicit development escape hatch and must not be exposed.
  profile: production
  port: 9081
  createToken: false
  existingTokenSecret: ""
  bearerToken: ""

# Optional Prometheus metrics listener. Enable ServiceMonitor only in clusters
# with the Prometheus Operator CRDs installed.
metrics:
  enabled: false
  port: 9082
  serviceMonitor:
    enabled: false

# Optional baseline NetworkPolicy. The default-off template is intentionally
# provider-neutral; narrow egress peers to your backend endpoint and
# kube-apiserver address, or replace this with provider-specific policy.
networkPolicy:
  enabled: false
  ingress:
    namespaceSelector: {}
    podSelector: {}
  egress:
    backend:
      to: []
      ports:
        - protocol: TCP
          port: 443
    kubeApi:
      to: []
      ports:
        - protocol: TCP
          port: 443

# read-write accepts repository mutations; restore-readonly rejects them.
# writerGuard=required enforces Kubernetes Lease coordination for read-write.
gateway:
  mode: read-write
  writerGuard: required

# Resource and request-admission limits. Increase multipart part size only after
# checking backend compatibility and memory budgets.
hardening:
  maxPutObjectBytes: 5368709120
  backendMultipartPartBytes: 16777216
  maxInFlightUploadBodyBytes: 536870912
  requestRateLimitPerSecond: 1024

# Public S3 bucket name presented to backup clients. This is not the backend
# object-store bucket.
publicBucket: client-bucket

# Backend object store. file:// is for local/dev PVC-backed smoke tests; use an
# S3-compatible endpoint for production-like deployments.
backend:
  endpoint: file:///data
  bucket: backend
  prefix: repository
  region: us-east-1

# Credentials for the backend object store. Prefer existingSecret in production.
backendCredentials:
  create: false
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

# Static S3 credentials accepted from backup clients. Prefer existingSecret in
# production and rotate credentials outside Helm history when possible.
credentials:
  create: false
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

# Commit batching trades write latency for fewer repository commits.
commit:
  maxBatchItems: 8
  maxBatchDelayMs: 5
  maxPendingItems: 8

# Repository identity settings. allowInit should only be true for a new, empty
# repository prefix under operator control.
repository:
  id: rs3-repository
  allowInit: false
  # Leave unset to use adaptive per-object segment sizing. Set a positive value
  # only for fixed-size compatibility or performance sweeps.
  payloadSegmentSizeBytes: null
  retention:
    mode: ""
    days: 0

# Repository key material and encrypted keyring envelope settings. Production
# requires existingSecret so secret bytes do not enter Helm release history.
repositoryKeys:
  create: false
  existingSecret: ""
  saltHex: ""
  envelopeObjectId: ""
  wrappingKeyId: wrap-v1
  wrappingKeyHex: ""

# Offline disaster-recovery verification key. This is public key material and
# may be stored in Helm values; keep the corresponding signing key offline.
recovery:
  publicKey: ""

# Rollback anchor coordination. Kubernetes Lease anchoring is the production
# preview default; memory anchors are local-development only.
anchor:
  mode: kubernetes-lease
  allowMemory: false
  namespace: ""
  name: v2-anchor
  fieldManager: rs3-server

# plain logs are human-readable; json logs are structured for collectors.
logging:
  format: plain
  rustLog: info

# Enable only for file:// backend smoke tests or other explicitly local storage.
persistence:
  enabled: false
  mountPath: /data
  storageClassName: ""
  size: 1Gi

# Default restricted pod security context for the gateway container.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# Default restricted container security context. `/tmp` is mounted as an
# emptyDir because the root filesystem is read-only.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Service account used by the gateway pod and Lease RBAC.
serviceAccount:
  create: true
  name: ""

# Lease RBAC. Set existing=true only when equivalent permissions are managed
# outside this chart.
rbac:
  create: true
  existing: false

# Kubernetes resource requests and limits. The memory limit leaves headroom
# above the measured roughly 790 MiB RSS in tests/PERFORMANCE_BASELINE.md; keep
# CPU as a request, not a limit, so crypto and compression can burst.
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1536Mi

# Recreate avoids two read-write gateway pods briefly racing on the same anchor.
updateStrategy:
  type: Recreate
