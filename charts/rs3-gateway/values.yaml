replicaCount: 1

image:
  repository: rs3-server
  tag: ci
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9080

gateway:
  mode: read-write
  writerGuard: required

hardening:
  maxPutObjectBytes: 5368709120
  bufferedPutObjectBytes: 67108864
  backendMultipartPartBytes: 16777216
  maxInFlightUploadBodyBytes: 536870912
  maxConcurrentConnections: 1024
  maxConcurrentRequests: 256
  requestRateLimitPerSecond: 1024

publicBucket: client-bucket

backend:
  endpoint: file:///data
  bucket: backend
  prefix: repository
  region: us-east-1

backendCredentials:
  create: false
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

credentials:
  create: false
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

commit:
  maxBatchItems: 8
  maxBatchDelayMs: 5
  maxPendingItems: 8

repository:
  format: v2-preview
  id: rs3-repository
  allowInit: false
  # Leave unset to use adaptive per-object segment sizing. Set a positive value
  # only for fixed-size compatibility or performance sweeps.
  payloadSegmentSizeBytes: null
  retention:
    mode: ""
    days: 0

repositoryKeys:
  create: false
  existingSecret: ""
  saltHex: ""
  envelopeObjectId: ""
  wrappingKeyId: wrap-v1
  wrappingKeyHex: ""

anchor:
  mode: kubernetes-lease
  allowMemory: false
  namespace: ""
  name: v2-anchor
  fieldManager: rs3-server

logging:
  format: plain
  rustLog: info

persistence:
  enabled: false
  mountPath: /data
  storageClassName: ""
  size: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  existing: false

resources: {}

updateStrategy:
  type: Recreate
