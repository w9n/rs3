[package]
name = "rs3-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line entry point for the rs3 gateway"

[features]
default = []
s3 = ["rs3-storage/s3", "dep:rustls"]
k8s = ["dep:rs3-k8s", "dep:rustls", "k8s-openapi/v1_35"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
k8s-openapi = { workspace = true, optional = true }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rs3-crypto.workspace = true
rs3-index.workspace = true
rs3-k8s = { workspace = true, optional = true }
rs3-repository.workspace = true
rs3-storage.workspace = true
rs3-types.workspace = true
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
], optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
s3s.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[lints]
workspace = true
