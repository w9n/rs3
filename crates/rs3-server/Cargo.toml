[package]
name = "rs3-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line entry point for the rs3 gateway"

[features]
default = []
s3 = ["rs3-storage/s3"]
k8s = ["dep:rs3-k8s", "k8s-openapi/v1_35"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
http.workspace = true
hyper-util.workspace = true
k8s-openapi = { workspace = true, optional = true }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rs3-anchor = { path = "../rs3-anchor" }
rs3-crypto = { path = "../rs3-crypto" }
rs3-k8s = { path = "../rs3-k8s", optional = true }
rs3-repository = { path = "../rs3-repository" }
rs3-storage = { path = "../rs3-storage" }
rs3-types = { path = "../rs3-types" }
secrecy.workspace = true
serde_json.workspace = true
s3s.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
