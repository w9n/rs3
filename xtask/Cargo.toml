[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Local automation for rs3"

[features]
default = []
s3 = ["rs3-storage/s3"]
containers = ["s3", "dep:aws-sdk-s3", "dep:procfs", "dep:testcontainers"]
k8s = ["s3", "dep:aws-sdk-s3"]

[dependencies]
anyhow.workspace = true
aws-sdk-s3 = { version = "1", optional = true }
bytes.workspace = true
clap.workspace = true
procfs = { version = "0.18.0", optional = true }
rs3-anchor = { version = "0.1.0", path = "../crates/rs3-anchor" }
rs3-crypto = { version = "0.1.0", path = "../crates/rs3-crypto" }
rs3-repository = { version = "0.1.0", path = "../crates/rs3-repository" }
rs3-storage = { version = "0.1.0", path = "../crates/rs3-storage" }
rs3-types = { version = "0.1.0", path = "../crates/rs3-types" }
serde_json.workspace = true
testcontainers = { version = "0.27.3", features = [
  "blocking",
  "http_wait_plain",
], optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
