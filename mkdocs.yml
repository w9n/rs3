site_name: rs3
site_description: Production-preview path-private, tamper-evident S3-compatible backup gateway for Kubernetes operators.
docs_dir: docs/site
site_dir: target/mkdocs-site

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  font:
    text: false
    code: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  generator: false

extra_css:
  - stylesheets/rs3.css

extra_javascript:
  - javascripts/rs3.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Evaluate:
      - Evaluation: evaluation.md
      - Production Preview: production-preview.md
      - Release Process: release-process.md
      - Getting Started: getting-started.md
      - Testing: testing.md
  - Understand:
      - Architecture: architecture.md
      - Security Model: security-model.md
      - Security Review: security-review.md
      - Performance: performance.md
  - Operate:
      - Operations: operations.md
      - Runbooks:
          - Retention And Object Lock: runbooks/retention-and-object-lock.md
          - Restore Under Attack: runbooks/restore-under-attack.md
  - Reference:
      - Glossary: reference/glossary.md
      - Configuration: reference/configuration.md
      - S3 Operations: reference/s3-operations.md
      - Repository Format: reference/repository-format.md
      - Deduplication: reference/deduplication.md
      - Console: reference/console.md
      - Cryptography: reference/cryptography.md
      - Metrics: reference/metrics.md
      - Alerts: reference/alerts.md

strict: true
