site_name: rs3
site_description: Path-private, tamper-evident S3-compatible backup gateway for Kubernetes operators.
docs_dir: docs/site
site_dir: target/mkdocs-site

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  font:
    text: false
    code: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - content.code.copy
    - navigation.instant
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  generator: false

extra_css:
  - stylesheets/rs3.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Evaluation: evaluation.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Security Model: security-model.md
  - Operations: operations.md
  - Performance: performance.md
  - Testing: testing.md
  - Reference:
      - Configuration: reference/configuration.md
      - Metrics: reference/metrics.md
      - Repository Format: reference/repository-format.md

strict: true
