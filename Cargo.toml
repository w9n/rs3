[workspace]
resolver = "3"
members = [
  "crates/rs3-console",
  "crates/rs3-crypto",
  "crates/rs3-index",
  "crates/rs3-k8s",
  "crates/rs3-repository",
  "crates/rs3-server",
  "crates/rs3-storage",
  "crates/rs3-types",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
repository = "https://github.com/w9n/rs3"
authors = ["rs3 contributors"]

[workspace.dependencies]
anyhow = "1.0.103"
async-trait = "0.1.88"
base64 = "0.22.1"
aes-gcm-siv = { version = "0.11.1", default-features = false, features = [
  "aes",
  "alloc",
] }
bytes = "1.10.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = [
  "alloc",
] }
clap = { version = "4.5.37", features = ["derive", "env"] }
futures-util = "0.3.31"
getrandom = "0.3.4"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = [
  "aws-lc-rs",
  "http1",
  "native-tokio",
  "tls12",
] }
hyper-util = { version = "0.1.19", features = [
  "client",
  "client-legacy",
  "http1",
  "http2",
  "server-auto",
  "server-graceful",
  "tokio",
] }
k8s-openapi = { version = "0.27.1", default-features = false }
kube = { version = "3.1.0", default-features = false, features = [
  "client",
  "rustls-tls",
] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
secrecy = "0.10.3"
subtle = { version = "2", default-features = false }
s3s = "0.14.1"
ring = "0.17.14"
sha2 = "0.10.8"
thiserror = "2.0.12"
time = "0.3.47"
tokio = { version = "1.44.2", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "test-util",
  "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
zeroize = "1.8.1"

rs3-crypto = { version = "0.1.0", path = "crates/rs3-crypto" }
rs3-index = { version = "0.1.0", path = "crates/rs3-index" }
rs3-k8s = { version = "0.1.0", path = "crates/rs3-k8s" }
rs3-repository = { version = "0.1.0", path = "crates/rs3-repository" }
rs3-storage = { version = "0.1.0", path = "crates/rs3-storage" }
rs3-types = { version = "0.1.0", path = "crates/rs3-types" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
