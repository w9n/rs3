path = "fuzz_targets/repository_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_bundle"
path = "fuzz_targets/recovery_bundle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v03_index_run"
path = "fuzz_targets/v03_index_run.rs"
test = false
doc = false
bench = false

[[bin]]
