[package]
name = "rs3-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
rs3-crypto = { path = "../crates/rs3-crypto", features = ["fuzzing"] }
rs3-repository = { path = "../crates/rs3-repository", features = ["fuzzing"] }
serde_json = "1.0.140"

[[bin]]
name = "v2_commit"
path = "fuzz_targets/v2_commit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v2_cbor"
path = "fuzz_targets/v2_cbor.rs"
test = false
doc = false
bench = false

