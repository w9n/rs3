[package]
name = "rs3-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
rs3-crypto = { path = "../crates/rs3-crypto", features = ["fuzzing"] }
rs3-repository = { path = "../crates/rs3-repository", features = ["fuzzing"] }

[[bin]]
name = "v03_commit"
path = "fuzz_targets/v03_commit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_cbor"
path = "fuzz_targets/canonical_cbor.rs"
test = false
doc = false
bench = false

[[bin]]
